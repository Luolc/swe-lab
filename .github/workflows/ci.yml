# Lightweight PR gate: format/lint/type-check + tests. The other workflows
# (eval / rollout / verify-golden) are heavy, manual Docker jobs — this is the
# fast check that keeps `main` always-green and can gate auto-merge.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# One in-flight run per ref; newer pushes cancel older ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the secret scan below reads commits, not the
          # worktree, so a shallow clone would hide everything but the tip.
          fetch-depth: 0

      # The second half of the credential guard. The pre-commit hook scans the
      # STAGED DIFF; there is no staged diff in CI, so this cannot be the same
      # scan — it reads the FULL HISTORY instead. The two input domains are
      # complementary: the hook is the only thing that sees a secret before it
      # becomes a commit, and this is the only thing that catches one that got
      # in anyway — via `--no-verify`, or from a clone where nobody ran
      # `pre-commit install`. Neither is redundant with the other.
      #
      # Pinned by version AND checksum: this downloads an executable and runs
      # it over the repository, so a moved tag must not change what runs.
      # gitleaks is a single static binary with no dependencies, which is why
      # this can run before `uv sync` and fail fast.
      - name: Scan history for secrets (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          # Unpack outside the checkout so the scanned repository stays exactly
          # what `actions/checkout` produced.
          bindir="$(mktemp -d)"
          tarball="${bindir}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" -C "$bindir" gitleaks
          # --redact is not optional: without it a finding prints the
          # credential into a public Actions log, so the scan that found the
          # leak becomes the leak.
          "${bindir}/gitleaks" git --redact --no-banner --verbose .

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Sync deps (creates .venv, installs dev group)
        run: uv sync

      - name: Tests
        # `-rs` lists every skip with its reason. Without it a green run
        # cannot answer "did the docker-marked tests run?" — `conftest.py`
        # auto-skips them when no daemon is reachable, so passing and skipped
        # look identical from the outside and the answer has to be inferred by
        # subtracting counts.
        run: uv run pytest -q -rs

      # pyink + ruff + isort + basedpyright + uv-lock. basedpyright type-checks
      # against .venv, so this runs after `uv sync`.
      - name: Format / lint / type-check
        run: uv run pre-commit run --all-files --show-diff-on-failure

  # The Rust runtime under rust/swe-lab-supervisor: the four gates the
  # toolchain gives (format, clippy with warnings as errors, tests, docs with
  # broken links as errors), then the release artifact itself.
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/swe-lab-supervisor
    steps:
      - uses: actions/checkout@v7

      # The toolchain has one home, rust-toolchain.toml: the version, the
      # components and the target. This job derives the version from it the
      # way scripts/check-in-container.sh derives its image — the action
      # needs a version before any cargo runs — and lists nothing else:
      # rustup installs the file's components and targets on first use.
      - name: Read the pinned toolchain
        id: toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          [ -n "$channel" ] || { echo "no channel in rust-toolchain.toml" >&2; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/swe-lab-supervisor

      # The gates themselves live in one file, shared with the container
      # script a toolchain-less machine uses: fmt, clippy with warnings as
      # errors, tests, docs with broken links as errors, a pure-Rust dependency
      # tree, the static musl build, and the structural check that the binary
      # has no PT_INTERP header (why not `file` or `ldd`: their wording moves).
      - name: Gates
        run: scripts/gates.sh

      - uses: actions/upload-artifact@v4
        with:
          name: swe-lab-supervisor-x86_64-unknown-linux-musl
          path: rust/swe-lab-supervisor/target/x86_64-unknown-linux-musl/release/swe-lab-supervisor
          if-no-files-found: error

  # The one status branch protection requires. It exists so that the required
  # check keeps its name while the work behind it is split across jobs that
  # run in parallel; it fails if any of them did not succeed (a skipped or
  # cancelled job is not a pass).
  check:
    needs: [python, rust]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every gate succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
