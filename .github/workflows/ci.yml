# Lightweight PR gate: format/lint/type-check + tests. The other workflows
# (eval / rollout / verify-golden) are heavy, manual Docker jobs — this is the
# fast check that keeps `main` always-green and can gate auto-merge.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # Every main commit needs a result of its own, so each one gets its own
  # group: a shared group would cancel a pending run when a newer one arrives.
  # On a PR branch, a newer push cancels the older run.
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      # `--locked` fails when uv.lock is out of date with pyproject.toml
      # instead of rewriting it, so CI checks the lock that was committed.
      - name: Sync deps (creates .venv, installs dev group)
        run: uv sync --locked

      - name: Tests
        # `-rs` lists every skip with its reason. Without it a green run
        # cannot answer "did the docker-marked tests run?" — `conftest.py`
        # auto-skips them when no daemon is reachable, so passing and skipped
        # look identical from the outside and the answer has to be inferred by
        # subtracting counts.
        run: uv run pytest -q -rs

      # ruff (lint, imports, format) + basedpyright + pydoclint + uv-lock.
      # The Python hooks run `uv run --frozen --no-sync` out of .venv, so this
      # runs after `uv sync`, the same order as locally.
      - name: Format / lint / type-check
        run: uv run --no-sync pre-commit run --all-files --show-diff-on-failure

  # The one status branch protection requires. It exists so that the required
  # check keeps its name however the work behind it is split into jobs; it
  # fails if any of them did not succeed (a skipped or cancelled job is not a
  # pass).
  check:
    needs: [python]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists the commits of the PR
    steps:
      - uses: actions/checkout@v7
        with:
          # The scan reads commits, not the worktree, so a shallow clone would
          # hide everything but the tip.
          fetch-depth: 0

      # The second half of the credential guard. The pre-commit hook scans the
      # STAGED DIFF; there is no staged diff in CI, so this scans the commits of
      # this pull request or push instead — one that got in anyway, via
      # `--no-verify` or from a clone where nobody ran `pre-commit install`.
      # The whole history is scanned weekly by gitleaks.yml, which is what
      # finds an old secret that a newer gitleaks rule recognizes. It runs in
      # this job because `check` is the status branch protection requires.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The rev of the gitleaks hook in .pre-commit-config.yaml; the two
          # move together.
          GITLEAKS_VERSION: 8.30.1
          # Commenting on the PR would need pull-requests: write; the job log
          # and summary show the finding.
          GITLEAKS_ENABLE_COMMENTS: false

      - name: Every gate succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
