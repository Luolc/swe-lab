name: verify-golden

# Full-dataset golden verification, sharded across a matrix. For every instance
# it runs two graded Docker runs — base (no patch, must fail) and golden (the
# dataset patch, must pass) — and classifies the pair. Public repo → unlimited
# Actions minutes; the native-amd64 runners avoid local Apple-Silicon emulation.
#
# Flow: setup (build the shard matrix) -> verify (matrix; each shard streams its
# slice, pruning images to bound disk, and uploads per-instance JSON artifacts)
# -> aggregate (always runs; merges all shards into summary.json + report.md and
# optionally commits them back). Re-running skips instances that already have a
# committed result, so a broken run resumes by just running again.
on:
  workflow_dispatch:
    inputs:
      shards:
        description: Number of stride shards (matrix size, max 256)
        required: true
        default: "64"
      jobs:
        description: Concurrent instances per shard (keep low on 2-core runners)
        required: true
        default: "1"
      limit:
        description: Cap instances per shard (0 = no cap; use a small value to smoke-test)
        required: true
        default: "0"
      refresh:
        description: Re-verify instances even if a result already exists
        type: boolean
        default: false

concurrency:
  group: verify-golden
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        env:
          N: ${{ inputs.shards }}
        run: |
          echo "matrix=$(python3 -c "import json,os;print(json.dumps(list(range(int(os.environ['N'])))))")" >> "$GITHUB_OUTPUT"

      # Fetch the parquet ONCE here and share it with every shard as an artifact.
      # Previously all N shards curl'd the same public HF URL at once; the
      # anonymous request burst got throttled and (without retry) took down whole
      # shard jobs on the download step. Downloading once and distributing via a
      # GitHub-internal artifact means exactly one HF request per run.
      - name: Download dataset parquet once (public HF)
        run: |
          mkdir -p parquet
          curl -fL --retry 8 --retry-all-errors --retry-delay 15 \
            --connect-timeout 30 \
            -o parquet/test-00000-of-00001.parquet \
            "https://huggingface.co/datasets/ScaleAI/SWE-bench_Pro/resolve/main/data/test-00000-of-00001.parquet?download=true"

      - name: Upload dataset parquet
        uses: actions/upload-artifact@v7
        with:
          name: dataset-parquet
          path: parquet/test-00000-of-00001.parquet
          if-no-files-found: error

  verify:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Set up uv (+ Python)
        uses: astral-sh/setup-uv@v9

      - name: Install deps
        run: uv sync

      - name: Fetch dataset parquet (setup artifact — no HF hit)
        uses: actions/download-artifact@v8
        with:
          name: dataset-parquet
          path: datasets/swebench_pro/data

      - name: Verify shard ${{ matrix.shard }}/${{ inputs.shards }}
        run: |
          uv run python -m swe_lab.datasets.swebench_pro.verify \
            --shard ${{ matrix.shard }}/${{ inputs.shards }} \
            --jobs ${{ inputs.jobs }} \
            --limit ${{ inputs.limit }} \
            --prune-images \
            ${{ inputs.refresh && '--refresh' || '' }}

      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-${{ matrix.shard }}
          path: .cache/store/runs/golden-verify
          if-no-files-found: ignore

  aggregate:
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv (+ Python)
        uses: astral-sh/setup-uv@v9

      - name: Install deps
        run: uv sync

      - name: Fetch dataset parquet (setup artifact — no HF hit)
        uses: actions/download-artifact@v8
        with:
          name: dataset-parquet
          path: datasets/swebench_pro/data

      - name: Merge shard artifacts into the store
        uses: actions/download-artifact@v8
        with:
          path: .cache/store/runs/golden-verify
          pattern: verify-*
          merge-multiple: true

      - name: Aggregate into summary.json + report.md
        run: uv run python -m swe_lab.datasets.swebench_pro.verify --aggregate

      - name: Upload summary
        uses: actions/upload-artifact@v7
        with:
          name: verification-summary
          path: |
            .cache/store/runs/golden-verify/summary.json
            .cache/store/runs/golden-verify/report.md

      # Results are T1 (object-store) intermediates, not committed to git: the
      # per-instance shards + summary ride as run artifacts here (transitional
      # T0/T1) and move to R2 when task 13 wires the S3 store. The report is
      # also written to the job summary above.
