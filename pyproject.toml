[project]
name = "swe-lab"
version = "0.3.7"
description = "Tooling to enrich and audit SWE-Bench evaluation data (related-files annotation, and more)"
readme = "README.md"
authors = [{ name = "Liangchen Luo", email = "luolc.witty@gmail.com" }]
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "swe-bench",
    "swe-bench-pro",
    "evaluation",
    "llm",
    "agent",
    "coding-agent",
    "sandbox",
    "dataset",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "etils[epath]>=1.14.0",
    "huggingface-hub>=1.22.0",
    "polars>=1.42.1",
    "pydantic>=2.10",
    "typer>=0.27.0",
]

[project.scripts]
swe-lab = "swe_lab.cli:app"

[project.urls]
Homepage = "https://github.com/Luolc/swe-lab"
Repository = "https://github.com/Luolc/swe-lab"
Issues = "https://github.com/Luolc/swe-lab/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swe_lab"]

# Keep the sdist to what's needed to build + verify the package — the package
# source, tests, and the project metadata files. Without this, hatchling's
# default sweeps in docs/, experiments/, and the committed outputs/ (~3.6 MB).
[tool.hatch.build.targets.sdist]
include = [
    "src/swe_lab",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "pre-commit>=4.6.2",
    "pytest>=9.0.3",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
markers = [
    "docker: integration test that needs a usable Docker daemon; auto-skipped when Docker is absent (see tests/conftest.py)",
]

[tool.basedpyright]
# Pinned rather than read off whichever interpreter basedpyright finds: a
# pre-commit hook environment can be older than .venv, and 3.14 syntax
# (PEP 758 except clauses) is an error under an older version.
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
exclude = ["**/__pycache__", "build"]
reportAny = false
reportExplicitAny = false
reportImplicitStringConcatenation = false
reportMissingTypeStubs = false
reportPrivateUsage = false
# Common in unit tests.
reportUninitializedInstanceVariable = false
# Many reports from built-in and third-party libraries
reportUnknownArgumentType = false
reportUnknownMemberType = false
# Too strict
reportUnknownVariableType = false
# False positives even with TYPE_CHECKING.
reportImportCycles = false

# Tests routinely call functions for their side effects or to assert on the
# exceptions they raise, so an unused return value is expected there.
[[tool.basedpyright.executionEnvironments]]
root = "tests"
reportUnusedCallResult = false

[tool.ruff]
line-length = 80
indent-width = 2
target-version = "py314"

[tool.ruff.lint]
select = [
    "B",      # flake8-bugbear
    "BLE",    # blind-except: a broad catch must say why, in its noqa
    "C",      # flake8-comprehensions, mccabe (C90: max-complexity below)
    "D",      # pydocstyle — Google convention (see [tool.ruff.lint.pydocstyle])
    "D401",   # imperative mood: repo-wide choice; google convention would drop it
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort (options in [tool.ruff.lint.isort])
    "ISC001", # single-line-implicit-string-concatenation
    "N",      # pep8-naming
    "PLW0129", # assert on a string literal: always passes, so it tests nothing
    "W",      # pycodestyle warnings
    "W505",   # doc-line-too-long (max-doc-length below)
    "RUF008", # mutable-dataclass-default
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]
ignore = [
    "E111", # indentation is not a multiple of 4
    "E114", # indentation is not a multiple of 4 (comment)
    "E117", # over-indented
    "W191", # indentation contains tabs
    # Trivial dunders are self-evident (guide §3.8.3 requires docstrings only
    # for public API / nontrivial / non-obvious functions).
    "D105",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

# The former [tool.isort] settings, mapped option by option (profile "black"
# and line_length are Ruff's defaults here). isort's `lexicographical` and
# `group_by_package` have no Ruff equivalent; force-sort-within-sections gives
# the same order except when `import a.b as c` and `from a.b import d` name the
# same module, where Ruff puts the `import` first.
[tool.ruff.lint.isort]
force-sort-within-sections = true
order-by-type = false
extra-standard-library = ["typing_extensions"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pycodestyle]
max-doc-length = 80

[tool.ruff.lint.per-file-ignores]
# Google style §3.8.2.1: test modules need no docstrings (format rules still apply).
"tests/**" = ["D1"]

[tool.ruff.format]
# Ruff also formats ```python blocks in Markdown, and its pre-commit hook passes
# it every .md file; 26 of them (outputs/ deliverables among them) would change.
# Keep the formatter on Python source, as before.
exclude = ["*.md"]

[tool.pydoclint]
# Reconcile pydoclint with ruff's D107 (undocumented-public-init): D107
# requires an __init__ docstring, while pydoclint's default (DOC301) forbids
# one. Allow __init__ docstrings; pydoclint still checks their contents.
allow-init-docstring = true
