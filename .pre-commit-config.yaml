# experiments/ holds exploratory reproduction scripts + captured run artifacts,
# not shipped code — exempt from the code-quality hooks (uv-lock is scoped to
# pyproject.toml, so it is unaffected).
exclude: ^experiments/

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.7
    hooks:
      - id: ruff
        args: ["--fix"]
  - repo: https://github.com/google/pyink
    rev: 25.12.0
    hooks:
      - id: pyink
  - repo: https://github.com/PyCQA/isort
    rev: 8.0.1
    hooks:
      - id: isort
  - repo: https://github.com/DetachHead/basedpyright-pre-commit-mirror
    rev: 1.39.0
    hooks:
      - id: basedpyright
  # Docstring Args:/Returns:/Raises: must match the actual signature. Types are
  # deliberately NOT checked in docstrings (basedpyright owns types; docstrings
  # never repeat them). "Sections must exist at all" is D417's job (ruff),
  # enabled at the end of horizontal task 01.
  - repo: https://github.com/jsh9/pydoclint
    rev: 0.9.1
    hooks:
      - id: pydoclint
        args:
          - --style=google
          - --arg-type-hints-in-docstring=False
          - --check-return-types=False
          - --check-yield-types=False
          - --show-filenames-in-every-violation-message=True
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.7
    hooks:
      - id: uv-lock
        files: ^pyproject.toml$
  # Guard against references to deleted / renamed modules and symbols creeping
  # back into code (the "delete guidance that contradicts the repo" rule). Fails
  # if any banned token reappears under src/ or tests/. Add a token here whenever
  # something is removed or renamed; historical docs under docs/ are exempt (they
  # are point-in-time records, not current guidance).
  - repo: local
    hooks:
      - id: no-stale-module-refs
        name: no references to deleted/renamed modules
        language: pygrep
        entry: 'swe_lab\.core\b|core\.agent\.trace|swe_lab\.solve\b|swe_lab\.cli\.verify\b|harnesses\.claude_code\.trace\b|swe_lab\.evaluation\.verify\b|\.execution\b|\b(CAPTURE_MODES|DEFAULT_CAPTURE|CAPTURE_PROXY|CAPTURE_STREAM|with_assets|materialize_to|BackendKind|build_backend|compile_sandbox_spec|compile_solve_prompt|fetch_harness|stream_to|ProxyRecorder|CONTAINER_PROXY_HOST|agent_proxy_url|proxy_base_url)\b|harnesses\.claude_code\.recorder\b'
        files: '^(src|tests)/.*\.py$'
