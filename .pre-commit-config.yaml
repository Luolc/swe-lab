# experiments/ holds exploratory reproduction scripts + captured run artifacts,
# not shipped code, so the formatting and typing hooks skip it (uv-lock is
# scoped to pyproject.toml, so it is unaffected either way). That exemption is
# declared **per hook** rather than once at the top, because a top-level
# `exclude` is applied before any hook's `files:` is consulted — so a per-hook
# `files:` can only narrow what survives it, never widen. Declared globally, it
# put experiments/ beyond the reach of every hook including the one guard that
# most needs to see it (`no-stale-module-refs`), and a widened `files:` there
# would have been inert while still reporting "Passed".
#
# The cost is that one line became five; the failure mode is loud rather than
# silent, which is why it is acceptable: omit one and that hook immediately
# starts checking experiments/ and goes red, rather than quietly not running.
repos:
  # First on purpose: a leaked credential has to be caught before any other
  # hook rewrites the staged files. This half scans the STAGED DIFF only (the
  # upstream entry ends in `--staged`), which is the only input domain that can
  # see a secret that is being committed right now; CI scans the commits of each
  # pull request or push instead, and the two domains are complementary, not
  # redundant — see the gitleaks step in .github/workflows/ci.yml. The whole
  # history is scanned weekly by .github/workflows/gitleaks.yml. Bump `rev`
  # together with GITLEAKS_VERSION in both workflows.
  #
  # `--redact` is repeated here although the upstream entry already carries it:
  # inherited, it is invisible in this file and one `rev` bump could drop it
  # silently. An unredacted secret scanner prints the credential it found into
  # the terminal and the session transcript — finding it would be the moment it
  # leaks — so the redundancy buys visibility, and it is harmless (verified:
  # the doubled flag still exits 1 on a staged fake token, prints
  # `Secret: REDACTED`, and the token appears 0 times in the output).
  #
  # When bumping `rev`, re-check that the upstream entry still contains
  # `--staged`; without it this hook silently changes what it scans.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: ["--redact", "--no-banner", "."]
  # The same split, over a second class of thing that must not be committed:
  # an operator home path (docs/conventions.md -> "no operator PII"). This half
  # sees the files of the commit being made, which is the only moment removing
  # one is a single edit rather than a rewrite of an artifact somebody has
  # since cited; `tests/test_operator_home_paths.py` scans every tracked file
  # instead, and catches what got in through `--no-verify`, through a clone
  # where nobody ran `pre-commit install`, or before this hook existed. One
  # implementation, read by both.
  #
  # Deliberately carries no `exclude`: experiments/ is where every one of the
  # 89 committed home paths this hook was written for actually lived, so the
  # exemption every other hook here takes is the one thing this hook must not.
  - repo: local
    hooks:
      - id: no-operator-home-paths
        name: no operator home path in a committed file
        language: system
        # The project interpreter, not whatever `python3` is on PATH: the
        # script is formatted for the Python pyproject.toml requires.
        # `--frozen --no-sync` as for the Python checkers below.
        entry: uv run --frozen --no-sync python tests/operator_home_paths.py
        # Binary files cannot hold a record anybody reads, and the scanner
        # skips what it cannot decode anyway; this keeps them off its argv.
        types: [text]
  # The Python checkers run from the project's .venv, so their versions live
  # once, in pyproject.toml's dev group and uv.lock, and basedpyright resolves
  # imports against the packages actually installed. `--frozen --no-sync`
  # keeps a hook from touching uv.lock or .venv, so nothing is installed
  # behind your back. A tool missing from .venv falls back to PATH: it fails
  # with `Failed to spawn` only when PATH has no other copy, and otherwise the
  # hook runs that copy (another venv activated in the shell, a global
  # install), whatever its version. A stale .venv is used as it is, without an
  # error, so run `uv sync` after changing a dependency (CI runs
  # `uv sync --locked` every time).
  #
  # Each hook checks the files it is given, not the whole repo: a full
  # basedpyright run takes about 19 s against the 5 s budget of a commit hook,
  # and `--all-files` (CI, the quality bar) hands every file over anyway.
  - repo: local
    hooks:
      # Lint (import sorting included, via `I`) before format: a lint fix can
      # leave code the formatter then settles, never the other way round.
      - id: ruff-check
        name: ruff check
        language: system
        entry: uv run --frozen --no-sync ruff check --force-exclude --fix
        types_or: [python, pyi, jupyter]
        require_serial: true
        exclude: ^experiments/
      - id: ruff-format
        name: ruff format
        language: system
        entry: uv run --frozen --no-sync ruff format --force-exclude
        # Markdown too, as upstream's hook does; pyproject.toml's
        # [tool.ruff.format] exclude is what keeps the formatter off it.
        types_or: [python, pyi, jupyter, markdown]
        require_serial: true
        exclude: ^experiments/
      - id: basedpyright
        name: basedpyright
        language: system
        entry: uv run --frozen --no-sync basedpyright
        types_or: [python, pyi]
        require_serial: true
        exclude: ^experiments/
      # Docstring Args:/Returns:/Raises: must match the actual signature. Types
      # are deliberately NOT checked in docstrings (basedpyright owns types;
      # docstrings never repeat them). "Sections must exist at all" is D417's
      # job (ruff), enabled at the end of horizontal task 01.
      - id: pydoclint
        name: pydoclint
        language: system
        entry: uv run --frozen --no-sync pydoclint
        args:
          - --style=google
          - --arg-type-hints-in-docstring=False
          - --check-return-types=False
          - --check-yield-types=False
          - --show-filenames-in-every-violation-message=True
        types: [python]
        require_serial: true
        exclude: ^experiments/
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.22
    hooks:
      - id: uv-lock
        files: ^pyproject.toml$
  # Guard against references to deleted / renamed modules and symbols creeping
  # back into code (the "delete guidance that contradicts the repo" rule). Fails
  # if any banned token reappears under src/, tests/ or experiments/. Add a
  # token here whenever something is removed or renamed; historical docs under
  # docs/ are exempt (they are point-in-time records, not current guidance).
  - repo: local
    hooks:
      - id: no-stale-module-refs
        name: no references to deleted/renamed modules (Python only)
        language: pygrep
        entry: 'swe_lab\.core\b|core\.agent\.trace|swe_lab\.solve\b|swe_lab\.cli\.verify\b|harnesses\.claude_code\.trace\b|swe_lab\.evaluation\.verify\b|\.execution\b|\b(CAPTURE_MODES|DEFAULT_CAPTURE|CAPTURE_PROXY|CAPTURE_STREAM|with_assets|materialize_to|BackendKind|build_backend|compile_sandbox_spec|compile_solve_prompt|fetch_harness|stream_to|ProxyRecorder|CONTAINER_PROXY_HOST|agent_proxy_url|proxy_base_url)\b|harnesses\.claude_code\.recorder\b|\b(native_supervision|supervisor_binary|transcript_marks|NativeSupervision|NATIVE_SUPERVISED_ROLLOUT|NATIVE_JUDGE_EVERY_N|SUPERVISOR_FLAGS|ensure_supervisor_binary|supervisor_proxy_target|supervisor_proxy_port|supervisor_api_key_env)\b|trace_synthesis\.channel\b|\b(CorrectionChannel|SupervisedRun|SupervisorPump|correction_channel|NeverSpeak|SpeakAt|WouldHaveSpoken|SupervisionFactory|supervision_factory|accepts_corrections|CONTROL_BUDGET|SUPERVISED_ROLLOUT|SUPERVISED_ROLLOUT_AND_UNIT_TEST|CONTROL_ROLLOUT|CONTROL_ROLLOUT_AND_UNIT_TEST|SUPERVISOR_TRANSPORT|CORRECTION_FIFO_NAME|CORRECTION_DROP_NAME|CORRECTION_DONE_NAME|CORRECTION_UNCLEAN_NAME|CORRECTION_RELAY_LOG_NAME|SUPERVISION_METRIC|SUPERVISION_LAPSE_METRIC|SUPERVISION_FAILED)\b|datasets\.oracle_failures\b|trace_synthesis\.sample\b|\b(OracleFailureInstance|ORACLE_ANALYSIS|ORACLE_GUIDED_TRACE|SEGMENTED_ROLLOUT|SEGMENTED_ROLLOUT_AND_UNIT_TEST|_GUIDEBOOK_SEGMENTED_ROLLOUT|_segmented_rollout|FailureFiles|STAGED_FAILURE|PRODUCED_FAILURE|produced_failure_prompt|failure_inputs|FAILURE_NAMES|FAILED_CONVERSATION_NAME|FAILED_VERDICT_NAME|FAILED_PATCH_NAME)\b'
        files: '^(src|tests|experiments)/.*\.py$'
