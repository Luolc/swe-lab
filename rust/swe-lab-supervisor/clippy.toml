# `unwrap`/`expect` are denied in the binary's code (Cargo.toml lints) but
# allowed in tests, where a panic is a perfectly good failure signal.
allow-unwrap-in-tests = true
allow-expect-in-tests = true

# Proper nouns that trip `doc_markdown` (pedantic) but are not code. `..`
# extends clippy's built-in list rather than replacing it.
doc-valid-idents = ["OpenAI", "OpenRouter", ".."]

# Every file the wrapper writes is opened through `outputs::Outputs::create`,
# which refuses two outputs on one file. A file created anywhere else is a
# second door that check does not guard — so there is none: the gate treats
# this lint as an error. Tests (unit and integration) are allowed to write
# their fixtures, at their crate roots.
disallowed-methods = [
    # Every way a file gets created, and the two ways one gets moved onto
    # another's path. An enumeration, so it may be short a name: when a new
    # way to create a file appears in std or in nix, it belongs here.
    { path = "std::fs::File::create", reason = "open an output through outputs::Outputs::create, which refuses two outputs on one file" },
    { path = "std::fs::File::create_new", reason = "open an output through outputs::Outputs::create, which refuses two outputs on one file" },
    { path = "std::fs::File::options", reason = "open an output through outputs::Outputs::create, which refuses two outputs on one file" },
    { path = "std::fs::OpenOptions::new", reason = "open an output through outputs::Outputs::create, which refuses two outputs on one file" },
    { path = "std::fs::write", reason = "open an output through outputs::Outputs::create, which refuses two outputs on one file" },
    { path = "std::fs::copy", reason = "open an output through outputs::Outputs::create, which refuses two outputs on one file" },
    { path = "std::fs::hard_link", reason = "open an output through outputs::Outputs::create, which refuses two outputs on one file" },
    { path = "std::os::unix::fs::symlink", reason = "open an output through outputs::Outputs::create, which refuses two outputs on one file" },
    { path = "std::fs::rename", reason = "replace an output through outputs::Outputs::replace, the door's own rename" },
    { path = "nix::fcntl::open", reason = "open an output through outputs::Outputs::create, which refuses two outputs on one file" },
    { path = "nix::fcntl::openat", reason = "open an output through outputs::Outputs::create, which refuses two outputs on one file" },
]
